[package]
name = "koudaisai-portal-backend"
version = "0.1.0"
edition = "2024"
license = "MIT"
autotests = false

[dependencies]
tokio = { version = "1.43.0", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
pkg-version = "1.0.0"
confy = "0.6.1"
serde = { version = "1.0.217", features = ["derive"] }
tracing = "0.1.41"
tracing-core = "0.1.33"
tracing-subscriber = { version = "0.3.20", features = ["json"] }
axum = { version = "0.8.4", features = ["default", "macros"] }
sha2 = "0.10.8"
argon2 = "0.5.3"
zeroize = { version = "1.8", features = ["derive"] }
uuid = { version = "1.13.1", features = ["v4", "serde"] }
rand = "0.9.3"
axum_gcra = { git = "https://github.com/pasmophobia/axum_gcra.git", branch = "axum-0.8" }
jsonwebtoken = { version = "10.3.0", features = ["default", "rust_crypto"] }
chrono = { version = "0.4.39", features = ["serde"] }
serde_json = "1.0.139"
reqwest = { version = "0.12.12", features = ["stream"] }
http = "1.2.0"
openidconnect = "4.0.0"
oauth2 = "5.0.0"
anyhow = "1.0.97"
tower-http = { version = "0.6.2", features = ["fs", "cors", "set-header"] }
base64url = "0.1.0"
aws-config = "1.6.2"
aws-sdk-s3 = "1.83.0"
linked-hash-map = "0.5.6"
scraper = "0.23.1"
sendgrid = "0.24.0"
axum-proxy = { version = "0.5.1", features = ["https", "http1", "axum"] }
tower = "0.5.2"
serenity = { version = "0.12.4", features = ["http", "model", "builder"] }
thiserror = "2.0.16"
aws-smithy-types = "1.3.1"
axum-extra = "0.10.1"
hyper = "1.6.0"
futures-util = "0.3.31"
regex = "1.11.1"
async-trait = "0.1.89"
utoipa = { version = "5.5.0", features = ["uuid", "chrono"] }
utoipa-axum = "0.2.0"
utoipa-axum-auto-into-response = "0.1.0"

[lib]
name = "koudaisai_portal_backend"
path = "src/lib.rs"

[dev-dependencies]
datatest-stable = "0.3.3"

[[test]]
name = "fixture_tests"
harness = false
