[logging]
log_level = "Trace"
json = false

[web.server]
host = "0.0.0.0"
port = 8080
base_url = "http://admin.koudaisai.localhost"

[web.auth]
password_salt = "P3Z9Pya4ixZg73HH"
activation_salt = "FNi7RleyOlsjWTLi"
stretch_cost = 13
jwt_secret_key_path = "./debug/private-key.pem"
jwt_public_key_path = "./debug/public-key.pem"

[web.auth.keycloak]
id = "koudaisai-portal"
secret = "CNX8FeUfQ6YR6O4bstU3Nhi7xlEUumRA"
issuer = "http://localhost:8000/realms/jizi-portal"

[web.static_files]
web_path = "/var/www/html/web"
admin_path = "/var/www/html/admin"

# v3 認証(argon2 + 回転セッション)。未指定の項目は OWASP/設計の既定値を使用。
# ローカル開発は http のため __Host-/Secure Cookie が使えない: 緩めた値で上書きする。
[web.auth_v3]
refresh_cookie_name = "refresh_token"
refresh_cookie_secure = false
refresh_cookie_same_site = "Lax"
reset_link_base = "http://portal.koudaisai.localhost/reset-password/confirm"
access_token_iss = "http://api.koudaisai.localhost"
cors_allowed_origins = [
    "http://portal.koudaisai.localhost",
    "http://admin.koudaisai.localhost",
    "http://join.koudaisai.localhost",
]

[db]
address = "sqlite://koudaisai-portal.db?mode=rwc"

[s3]
# S3連携が必要な場合は別途設定の必要あり
access_key_id = ""
secret_access_key = ""
endpoint = ""
bucket = ""

[ses]
# Amazon SES連携が必要な場合は別途設定の必要あり
sender_address = ""
region = "ap-northeast-1"
access_key_id = ""
secret_access_key = ""

[discord]
# Discord連携が必要な場合は別途設定の必要あり
approval_request_url = ""

[events26]
# 企画情報APIの接続先。staging を向ける場合は
# "https://events26-staging.koudaisai.jp" に変更する。
base_url = "https://events26-staging.koudaisai.jp"

[secrets]
# 企画情報API連携が必要な場合は別途設定の必要あり
plans_info_api_client_id = ""
plans_info_api_client_secret = ""
# 回転セッションの HMAC ペッパー(本番では十分長いランダム値に変更すること)
session_secret_pepper = "dev-only-change-me-in-production"
