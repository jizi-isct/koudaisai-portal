name = "join"
compatibility_date = "2025-09-05"
preview_urls = true
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"

[observability]
enabled = true

[[routes]]
pattern = "join.koudaisai.jp"
custom_domain = true

[env.preview]
name = "join-preview"

[[env.preview.routes]]
pattern = "join-preview.koudaisai.jp"
custom_domain = true

[vars]
API_URL = "https://api.koudaisai.jp/api/v3"
GA_MEASUREMENT_ID = "G-F4ZGY9C6BG"

[env.preview.vars]
API_URL = "https://api-preview.koudaisai.jp/api/v3"