post:
  summary: パスワードのリセット承認
  description: |
    パスワードリセットトークンが有効であることを確認し、パスワードリセットを承認します。
  tags:
    - auth
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/PasswordResetConfirm.yml'
  responses:
    '200':
      description: OK
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
