post:
  summary: パスワードリセットリクエスト
  description: |
    ユーザーがパスワードを忘れた場合に、パスワードリセットのためのメールを送信します。
    メールアドレスを指定してリクエストを行います。
  tags:
    - auth
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/PasswordReset.yml'
  responses:
    '204':
      description: No Content
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
