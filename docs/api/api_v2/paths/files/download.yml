get:
  summary: ファイルのダウンロードurlを取得
  tags:
    - files
  parameters:
    - in: query
      name: key
      schema:
        type: string
      required: true
    - in: query
      name: file_name
      schema:
        type: string
      required: true
    - in: query
      name: redirect
      schema:
        type: boolean
      description: リダイレクトするかどうか．デフォルト値は`false`
  responses:
    '201':
      description: Changed
      content:
        application/json:
          schema:
            type: object
            properties:
              presigned_url:
                type: string
    '302':
      description: redirect=trueの場合に返される．リソースへのリダイレクト
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合