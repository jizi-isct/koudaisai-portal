post:
  summary: 承認申請を取り下げる
  tags:
    - approval_requests
  parameters:
    - name: user_id
      in: path
      description: ユーザーのID
      required: true
      schema:
        type: string
        format: uuid
    - name: request_id
      in: path
      description: 承認申請のID
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: No Content
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
    '500':
      description: サーバーエラー
  security:
    - exhibitor_bearer: []
