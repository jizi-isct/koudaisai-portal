get:
  summary: 承認申請をすべて取得
  tags:
    - approval_requests
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/approval_request/ReadApprovalRequest.yml'
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
    '500':
      description: サーバーエラー
  security:
    - admin_oidc:
        - k-portal:admin:all
