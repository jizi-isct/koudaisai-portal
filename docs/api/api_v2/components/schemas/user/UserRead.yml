type: object
properties:
  id:
    description: unique id
    type: string
    format: uuid
    readOnly: true
  created_at:
    description: 作成日時
    type: string
    format: date-time
    readOnly: true
  updated_at:
    description: 最終更新日時
    type: string
    format: date-time
    readOnly: true
  name:
    description: 名前
    type: string
    example: Paul Johnson
  m_address:
    description: mアドレス(新旧どちらも含む)
    type: string
    example: johnson.p.5703@m.isct.ac.jp
  group_id:
    description: 団体id
    type: string
    pattern: '[A-Z]-[0-9][0-9][0-9]'
    example: T-001
required:
  - id
  - created_at
  - updated_at
  - name
  - m_address
  - group_id
