get:
  summary: 全ての通知を取得
  description: |-
    ### authの違いによる挙動の違い
    - **exhibitor_bearerの場合**: 自分が通知対象である全ての通知を取得
    - **admin_oidcの場合**: 存在する通知を全て取得
  tags:
    - notifications
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../components/schemas/notification/NotificationRead.yml"
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
  security:
    - exhibitor_bearer: [ ]
    - admin_oidc:
        - k-portal:admin:all
post:
  summary: 通知を新規作成
  tags:
    - notifications
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/notification/NotificationCreate.yml"
  responses:
    '201':
      description: Created
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
  security:
    - admin_oidc:
        - k-portal:admin:all