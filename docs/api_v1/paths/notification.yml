get:
  summary: 全ての通知を取得
  tags:
    - notifications
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../components/schemas/notification/NotificationRead.yml"
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
  security:
    - admin_oidc:
        - k-portal:admin:all
post:
  summary: 通知を新規作成
  tags:
    - notifications
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/notification/NotificationCreate.yml"
  responses:
    '201':
      description: Created
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
  security:
    - admin_oidc:
        - k-portal:admin:all