get:
  summary: 通知を取得
  description: |-
    ### authの違いによる挙動の違い
    - **exhibitor_bearerの場合**: 自分が通知対象である場合通知を取得可能
    - **admin_oidcの場合**: 存在する通知を全て取得可能
  tags:
    - notifications
  parameters:
    - name: notification_id
      in: path
      description: 通知id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: "../components/schemas/notification/NotificationRead.yml"
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
  security:
    - exhibitor_bearer: [ ]
    - admin_oidc:
        - k-portal:admin:all
patch:
  summary: 通知を更新
  tags:
    - notifications
  parameters:
    - name: notification_id
      in: path
      description: 通知ID
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/notification/NotificationUpdate.yml"
  responses:
    '204':
      description: No Content
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
  security:
    - admin_oidc:
        - k-portal:admin:all
delete:
  summary: 通知を削除
  tags:
    - notifications
  parameters:
    - name: notification_id
      in: path
      description: 通知ID
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: No Content
    '401':
      description: 資格情報が無効だった場合
    '404':
      description: フォームが存在しない
  security:
    - admin_oidc:
        - k-portal:admin:all
