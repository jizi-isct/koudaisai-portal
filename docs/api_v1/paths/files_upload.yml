post:
  summary: ファイルのアップロードurlを取得
  tags:
    - files
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            file_name:
              type: string
          required:
            - file_name
  responses:
    '201':
      description: Changed
      content:
        application/json:
          schema:
            type: object
            properties:
              presigned_url:
                type: string
              key:
                type: string
            required:
              - presigned_url
              - key
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
  security:
    - admin_oidc:
        - k-portal:admin:all