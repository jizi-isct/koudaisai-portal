get:
  summary: 資料カテゴリをすべて取得
  tags:
    - documents
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../components/schemas/document_category/ReadDocumentCategory.yml"
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
  security:
    - exhibitor_bearer: [ ]
    - admin_oidc:
        - k-portal:admin:all
post:
  summary: 資料カテゴリを新規作成
  tags:
    - documents
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/document_category/CreateDocumentCategory.yml"
  responses:
    '201':
      description: Changed
      content:
        application/json:
          schema:
            $ref: "../components/schemas/document_category/ReadDocumentCategory.yml"
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
  security:
    - admin_oidc:
        - k-portal:admin:all