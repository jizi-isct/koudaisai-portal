get:
  summary: 承認申請を取得
  tags:
    - approval_requests
  parameters:
    - name: user_id
      in: path
      description: ユーザーのID
      required: true
      schema:
        type: string
        format: uuid
    - name: request_id
      in: path
      description: 承認申請のID
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: "../components/schemas/approval_request/ReadApprovalRequest.yml"
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
    '404':
      description: 承認申請が存在しないか、アクセス権限がない
    '500':
      description: サーバーエラー
  security:
    - exhibitor_bearer: [ ]
