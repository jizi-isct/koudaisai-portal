type: string
description: Target specifier for forms
oneOf:
  - enum:
      - exhibitor/type/general
      - exhibitor/type/booth
      - exhibitor/type/stage
      - exhibitor/type/labo
      - user/nologin
    example: exhibitor/type/general
  - pattern: ^user/id/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    example: user/id/12345678-1234-1234-1234-123456789012
  - pattern: ^exhibitor/id/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    example: exhibitor/id/12345678-1234-1234-1234-123456789012
