type: object
description: Generic form properties
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier
  created_at:
    type: string
    format: date-time
    description: Timestamp when the form was created
  updated_at:
    type: string
    format: date-time
    description: Timestamp when the form was last updated
  created_by:
    type: string
    format: uuid
    description: User ID of the creator
  updated_by:
    type: string
    format: uuid
    description: User ID of the last updater
  targets:
    type: array
    description: Target specifiers for the form
    items:
      $ref: "../common/TargetSpecifier.yml"
  form_name:
    type: string
    description: Name of the form
  summary:
    type: string
    description: Summary or description of the form
  due_date:
    type: string
    format: date-time
    description: Due date for the form submission
    nullable: true
required:
  - id
  - created_at
  - updated_at
  - created_by
  - updated_by
  - targets
  - form_name
  - summary
  - due_date
