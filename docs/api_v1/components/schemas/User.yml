type: object
properties:
  id:
    description: unique id
    type: string
    format: uuid
    readOnly: true
  created_at:
    description: 作成日時
    type: string
    format: date-time
    readOnly: true
  updated_at:
    description: 最終更新日時
    type: string
    format: date-time
    readOnly: true
  first_name:
    description: 名
    type: string
    example: Paul
  last_name:
    description: 姓
    type: string
    example: Johnson
  m_address:
    description: mアドレス(新旧どちらも含む)
    type: string
    example: johnson.p.5703@m.isct.ac.jp
required:
  - id
  - created_at
  - updated_at
  - first_name
  - last_name
  - m_address