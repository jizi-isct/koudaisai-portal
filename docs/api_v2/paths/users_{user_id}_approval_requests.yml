get:
  summary: 承認申請をすべて取得
  tags:
    - approval_requests
  parameters:
    - name: user_id
      in: path
      description: ユーザーのID
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../components/schemas/approval_request/ReadApprovalRequest.yml"
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
    '500':
      description: サーバーエラー
  security:
    - exhibitor_bearer: [ ]
post:
  summary: 承認申請を新規作成
  tags:
    - approval_requests
  parameters:
    - name: user_id
      in: path
      description: ユーザーのID
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/approval_request/CreateApprovalRequest.yml"
  responses:
    '204':
      description: No Content
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
    '500':
      description: サーバーエラー
  security:
    - exhibitor_bearer: [ ]