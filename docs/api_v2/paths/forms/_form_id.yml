get:
  summary: フォームを取得
  description: |-
    ### authの違いによる挙動の違い
    - **exhibitor_bearerの場合**: targetに基づいてアクセス可能なフォームな場合取得
    - **admin_oidcの場合**: 存在するフォームを全て取得
  tags:
    - forms
  parameters:
    - name: form_id
      in: path
      description: フォームID
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/form/FormRead.yml"
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
  security:
    - exhibitor_bearer: [ ]
    - admin_oidc:
        - k-portal:admin:all
patch:
  summary: フォームを更新
  tags:
    - forms
  parameters:
    - name: form_id
      in: path
      description: フォームID
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/form/FormUpdate.yml"
  responses:
    '204':
      description: No Content
    '400':
      description: 不正なrequest bodyの形式
    '401':
      description: 資格情報が無効だった場合
  security:
    - admin_oidc:
        - k-portal:admin:all
delete:
  summary: フォームを削除
  tags:
    - forms
  parameters:
    - name: form_id
      in: path
      description: フォームID
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: No Content
    '401':
      description: 資格情報が無効だった場合
    '404':
      description: フォームが存在しない
  security:
    - admin_oidc:
        - k-portal:admin:all
