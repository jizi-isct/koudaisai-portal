post:
  summary: 団体を追加
  tags:
    - groups
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/group/GroupCreate.yml
  responses:
    '204':
      description: 団体が追加された
    '400':
      description: 不正なrequest bodyの形式
    '409':
      description: 団体またはユーザーがすでに存在する
  security:
    - admin_oidc: [ ]
get:
  summary: すべての団体を取得
  tags:
    - groups
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/group/GroupRead.yml
  security:
    - admin_oidc: [ ]