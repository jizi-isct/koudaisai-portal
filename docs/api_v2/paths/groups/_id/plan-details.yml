get:
  summary: 企画の詳細情報を取得
  description: 自分が属する団体の企画のみ取得可能。取材団体等の企画と紐付けされていない団体は404が返されます。
  tags:
    - groups
  parameters:
    - name: id
      in: path
      description: 団体ID
      required: true
      schema:
        type: string
        example: M-001
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/plan-details/PlanDetailsRead.yml
    '400':
      description: 不正なrequest bodyの形式
    '404':
      description: 企画が存在しない
  security:
    - exhibitor_bearer: [ ]
patch:
  summary: 企画詳細情報を編集
  description: 自分が属する団体のみ編集可能
  tags:
    - groups
  parameters:
    - name: id
      in: path
      description: 団体ID
      required: true
      schema:
        type: string
        example: M-001
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/plan-details/PlanDetailsUpdate.yml
  responses:
    '200':
      description: 企画情報が正常に編集された
    '400':
      description: 不正なrequest bodyの形式
    '404':
      description: 企画が存在しない
  security:
    - exhibitor_bearer: [ ]
