type: string
description: Target specifier for forms
oneOf:
  - enum:
      - group/type/plan_general
      - group/type/plan_booth
      - group/type/plan_stage
      - group/type/plan_labo
      - group/type/press
      - user/nologin
    example: group/type/plan_general
  - pattern: ^user/id/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    example: user/id/12345678-1234-1234-1234-123456789012
  - pattern: ^group\/id\/[A-Z]-[0-9]{3}$
    example: group/id/M-001
