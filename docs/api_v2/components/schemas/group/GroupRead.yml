type: object
properties:
  id:
    description: 団体ID
    type: string
    readOnly: true
  created_at:
    description: 作成日時
    type: string
    format: date-time
    readOnly: true
  updated_at:
    description: 最終更新日時
    type: string
    format: date-time
    readOnly: true
  name:
    description: 団体名
    type: string
    example: 工大祭実行委員会
  type_plan:
    $ref: './plan/PlanRead.yml'
  type_press:
    $ref: './press/PressRead.yml'
required:
  - id
  - created_at
  - updated_at
  - name
