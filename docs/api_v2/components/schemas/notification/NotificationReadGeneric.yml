type: object
properties:
  id:
    description: 通知ID
    type: string
    format: uuid
  created_at:
    description: 作成日時
    type: string
    format: date-time
  updated_at:
    description: 最終更新日時
    type: string
    format: date-time
  created_by:
    description: 作成者のユーザーID
    type: string
    format: uuid
  updated_by:
    description: 最終更新者のユーザーID
    type: string
    format: uuid
  title:
    description: 通知のタイトル
    type: string
  target:
    description: |
      通知の対象を含む配列
      - `exhibitor/type/general` - 一般企画責任者
      - `exhibitor/type/booth` - 模擬店企画責任者
      - `exhibitor/type/stage` - ステージ企画責任者
      - `exhibitor/type/labo` - 研究室企画責任者
      - `user/id/${user_id}` - 特定のユーザー
      - `user/nologin` - ログインしていないユーザー
    type: array
    items:
      type: string
required:
  - id
  - created_at
  - updated_at
  - created_by
  - updated_by
  - title
  - target