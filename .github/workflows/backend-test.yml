name: Backend Test

on:
  pull_request:

jobs:
  test:
    name: nx test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        run: rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npx nx test backend
