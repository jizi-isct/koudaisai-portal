name: Deploy Frontend

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Nx local cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('**/package-lock.json') }}-
      - name: Decide tags
        id: tags
        run: |
          TAG="preview"
          if [[ "${{ github.event.release.prerelease }}" == "false" ]]; then
            TAG="production"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Deploy to production
        if: env.TAG == "production"
        run: npx nx run-many -t deploy:production -p portal,admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to preview
        if: env.TAG == "preview"
        run: npx nx run-many -t deploy:preview -p portal,admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
