name: Update events26 API Types

on:
  repository_dispatch:
    types: [events26-released]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-events26-types
  cancel-in-progress: false

jobs:
  update-types:
    name: Regenerate types and open a pull request
    runs-on: ubuntu-latest
    env:
      NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # flake.nix pins Node.js, Rust and openapi-generator-cli (including its
      # 7.24.0 generator), so CI produces the same files as local development.
      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Regenerate events26 API clients and types
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            npm ci
            npx nx generate-rust-client backend
            npx nx run docs-api:update-clients
          '

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: chore/update-events26-types
          delete-branch: true
          commit-message: 'chore: update events26 API types'
          title: 'chore: update events26 API types'
          body: |
            events26 のリリースを受けて、OpenAPI 仕様から次の生成物を更新します。

            - Rust API クライアント
            - backend の OpenAPI 仕様と TypeScript 型
            - events26 の TypeScript 型

            Triggered by `${{ github.event.action }}`.
