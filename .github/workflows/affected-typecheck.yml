name: Affected Typecheck

on:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: nx affected -t typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Cache Nx local cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('**/package-lock.json') }}-

      - name: Astro sync
        run: |
          (cd apps/admin && npx astro sync)
          (cd apps/portal && npx astro sync)
          (cd apps/join && npx astro sync)

      - name: Run affected typecheck
        run: npx nx affected -t typecheck
